name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet & Test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build test binary
        run: go build -o fb-loadgen .

      - name: Test
        run: go test -race ./...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

  firebird:
    name: Smoke (Firebird 5, linux)
    runs-on: ubuntu-latest
    services:
      firebird:
        image: firebirdsql/firebird:5.0.4
        env:
          ISC_PASSWORD: masterkey
        ports:
          - 3050:3050
    # No docker health check: the isql one-liner never reports healthy in this
    # image; readiness is handled by the retry loop below instead.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build test binary
        run: go build -o fb-loadgen .

      - name: Create empty smoke database
        run: |
          set -e
          CID=$(docker ps -q --filter "ancestor=firebirdsql/firebird:5.0.4" | head -1)
          for i in $(seq 1 30); do
            # isql takes statements on stdin — a quoted argument would be
            # parsed as a database name to connect to
            if echo "create database '/tmp/smoke.fdb';" | docker exec -i "$CID" isql -user SYSDBA -password masterkey; then
              echo "database created"
              exit 0
            fi
            echo "waiting for firebird ($i/30)"; sleep 2
          done
          echo "firebird did not become ready"
          exit 1

      - name: Smoke test
        env:
          FIREBIRD_TEST_DSN: localhost/3050:/tmp/smoke.fdb
        run: go test -race -run "TestBasicExecution|TestHelpOutput|TestConfigValidation" -v .
