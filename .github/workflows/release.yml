name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="fb-loadgen_${VERSION}_${GOOS}_${GOARCH}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"
          cp LICENSE README.md "${STAGE}/"
          go build -trimpath -ldflags "-s -w" -o "${STAGE}/fb-loadgen${{ matrix.ext }}" .
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -qr "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi
          rm -rf "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: fb-loadgen-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/fb-loadgen_*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum fb-loadgen_* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fb-loadgen_*
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
